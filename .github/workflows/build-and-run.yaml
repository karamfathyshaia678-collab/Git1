name: build-and-run
  
on :
  push:
  pull_requests:
  workflow_dispatch:


  jobs: 
    build-and-run
      runs-on : ubuntu-latest  
        
      steps:
         - name: checkout
          uses: action/checkout@v4

         - name: Build Docker Image
          run: docker build -t my-app .

         - name : Run container 
           run : docker run -d --name my-app -p 5000:5000 my-app
        - name : Test Application
          run : |
            sleep 10
            curl -f http://localhost:5000

        - name: Stop Container
          run: docker stop my app
        - name: Remove Container
          run: docker rm my-app                   